server:
  port: 8083
spring:
  application:
    name: provisioning-service
  datasource:
    url: jdbc:h2:mem:provisioning;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
portal:
  opa:
    url: ${OPA_URL:http://localhost:8181}
  audit:
    url: ${AUDIT_URL:http://localhost:8084}
  notification:
    url: ${NOTIFICATION_URL:http://localhost:8085}
management:
  endpoints:
    web:
      exposure:
        include: health,info
---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:5432/provisioning
    username: ${DB_USER:portal}
    password: ${DB_PASSWORD:portal}
