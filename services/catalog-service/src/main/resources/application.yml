server:
  port: 8081
spring:
  application:
    name: catalog-service
  datasource:
    url: jdbc:h2:mem:catalog;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
portal:
  opa:
    url: ${OPA_URL:http://localhost:8181}
management:
  endpoints:
    web:
      exposure:
        include: health,info
---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:5432/catalog
    username: ${DB_USER:portal}
    password: ${DB_PASSWORD:portal}
