server:
  port: 8084
spring:
  application:
    name: audit-service
  datasource:
    url: jdbc:h2:mem:audit;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:5432/audit
    username: ${DB_USER:portal}
    password: ${DB_PASSWORD:portal}
