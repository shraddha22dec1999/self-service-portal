name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test all services
        run: mvn -B verify

  policies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 0.70.0
      - name: Check policies
        run: opa check --strict opa
      - name: Test policies
        run: opa test opa -v

  docker:
    runs-on: ubuntu-latest
    needs: [java, policies]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
